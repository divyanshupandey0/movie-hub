name: MOVIE HUB Production Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to build/publish (e.g. 1.1.2 or v1.1.2)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify and Restore Signing Keystore
        env:
          MOVIEHUB_KEYSTORE_BASE64: ${{ secrets.MOVIEHUB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$MOVIEHUB_KEYSTORE_BASE64" ]; then
            echo "::error::Required secret MOVIEHUB_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Required secret KEYSTORE_PASSWORD is missing or empty."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Required secret KEY_ALIAS is missing or empty."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required secret KEY_PASSWORD is missing or empty."
            exit 1
          fi

          mkdir -p keystore
          echo "$MOVIEHUB_KEYSTORE_BASE64" | base64 -d > keystore/moviehub-debug.keystore

          if [ ! -s keystore/moviehub-debug.keystore ]; then
            echo "::error::Failed to decode keystore file or file is empty at keystore/moviehub-debug.keystore."
            exit 1
          fi

      - name: Build Universal Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Clean up Signing Keystore
        if: always()
        run: rm -f keystore/moviehub-debug.keystore

      - name: Validate Release APK Metadata
        run: |
          TARGET_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          EXPECTED_VERSION="${TARGET_TAG#v}"

          APK_PATH=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated in app/build/outputs/apk/release/!"
            exit 1
          fi

          AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          if [ -z "$AAPT_BIN" ]; then
            echo "::error::aapt tool not found in Android build-tools!"
            exit 1
          fi

          BADGING=$("$AAPT_BIN" dump badging "$APK_PATH")
          ACTUAL_PKG=$(echo "$BADGING" | grep -oP "package: name='\K[^']+")
          ACTUAL_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")
          ACTUAL_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")

          echo "=================================================="
          echo "🎯 RELEASE APK METADATA AUDIT"
          echo "Target Tag:         $TARGET_TAG"
          echo "Expected Version:   $EXPECTED_VERSION"
          echo "Actual Package:     $ACTUAL_PKG"
          echo "Actual versionCode: $ACTUAL_CODE"
          echo "Actual versionName: $ACTUAL_NAME"
          echo "=================================================="

          if [ "$ACTUAL_PKG" != "com.euthopiar" ]; then
            echo "::error::Package name mismatch! Expected 'com.euthopiar', but got '$ACTUAL_PKG'."
            exit 1
          fi

          if [ -n "$EXPECTED_VERSION" ] && [ "$ACTUAL_NAME" != "$EXPECTED_VERSION" ]; then
            echo "::error::Release version mismatch! Tag requires version '$EXPECTED_VERSION', but compiled APK has versionName '$ACTUAL_NAME'. Update app/build.gradle.kts before releasing!"
            exit 1
          fi

          if [ "$ACTUAL_CODE" -le 111 ]; then
            echo "::error::VersionCode '$ACTUAL_CODE' must be strictly greater than 111 (version 1.1.1). Update app/build.gradle.kts!"
            exit 1
          fi

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --verbose "$APK_PATH" || {
              echo "::error::APK signature verification failed!"
              exit 1
            }
          fi

          mkdir -p release_assets
          cp "$APK_PATH" "release_assets/MOVIE-HUB-v${ACTUAL_NAME}.apk"
          cp "$APK_PATH" "release_assets/MOVIE-HUB-${ACTUAL_NAME}.apk"

          echo "ACTUAL_NAME=$ACTUAL_NAME" >> $GITHUB_ENV
          echo "ACTUAL_CODE=$ACTUAL_CODE" >> $GITHUB_ENV
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: MOVIE HUB v${{ env.ACTUAL_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: "true"
          files: |
            release_assets/MOVIE-HUB-v${{ env.ACTUAL_NAME }}.apk
            release_assets/MOVIE-HUB-${{ env.ACTUAL_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
