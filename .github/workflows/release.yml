name: MOVIE HUB Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify and Restore Signing Keystore
        env:
          MOVIEHUB_KEYSTORE_BASE64: ${{ secrets.MOVIEHUB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$MOVIEHUB_KEYSTORE_BASE64" ]; then
            echo "::error::Required secret MOVIEHUB_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Required secret KEYSTORE_PASSWORD is missing or empty."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Required secret KEY_ALIAS is missing or empty."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required secret KEY_PASSWORD is missing or empty."
            exit 1
          fi

          mkdir -p keystore
          echo "$MOVIEHUB_KEYSTORE_BASE64" | base64 -d > keystore/moviehub-debug.keystore

          if [ ! -s keystore/moviehub-debug.keystore ]; then
            echo "::error::Failed to decode keystore file or file is empty at keystore/moviehub-debug.keystore."
            exit 1
          fi

      - name: Build Universal Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean up Signing Keystore
        if: always()
        run: rm -f keystore/moviehub-debug.keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MOVIE HUB ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
